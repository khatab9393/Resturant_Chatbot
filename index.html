<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Bite – Menu Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍗</text></svg>">
<style>
  :root { --bg:#ffffff; --fg:#241a17; --muted:#8c7f7a; --accent:#e8431f; --accent2:#ff8a1f; --tint:#fff3ec; --line:#f0e4de; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; }
  body.empty { background:radial-gradient(ellipse 80% 55% at 50% 0%, #ffe9dc 0%, #fff7f2 45%, #ffffff 80%); }

  header { display:flex; align-items:center; gap:10px; padding:14px 24px; font-weight:700; font-size:17px; }
  .logo { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none; }

  #chat { flex:1; overflow-y:auto; padding:8px 16px 24px; }
  .wrap { max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  .row { display:flex; gap:12px; align-items:flex-start; animation:fade .3s ease both; }
  .row.user { justify-content:flex-end; }
  .row .logo { width:30px; height:30px; font-size:15px; margin-top:2px; }
  .msg { white-space:pre-wrap; word-wrap:break-word; }
  .row.user .msg { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; padding:10px 18px; border-radius:22px 22px 6px 22px; max-width:80%; box-shadow:0 2px 8px rgba(232,67,31,.2); }
  .row.bot .msg { background:var(--tint); padding:10px 18px; border-radius:6px 22px 22px 22px; max-width:calc(100% - 44px); }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  .dots { display:inline-flex; gap:5px; padding:6px 0; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--accent2); animation:bounce 1.1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.5; } 30% { transform:translateY(-5px); opacity:1; } }

  /* Empty state: greeting, input bar and quick questions in the middle */
  #hero { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; padding:0 16px 8vh; }
  #hero .big { width:72px; height:72px; font-size:38px; margin-bottom:14px; box-shadow:0 6px 20px rgba(232,67,31,.3); }
  #hero h1 { font-size:32px; line-height:1.2; font-weight:800; margin:0 0 8px; text-align:center; }
  #hero h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #hero p { color:var(--muted); margin:0 0 26px; text-align:center; }
  #slotCenter { width:100%; max-width:720px; }
  #chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:18px; max-width:720px; }
  .chip { border:1px solid var(--line); background:#fff; color:var(--fg); font:inherit; font-size:14px; padding:8px 16px; border-radius:999px; cursor:pointer; transition:.15s; }
  .chip:hover { background:var(--tint); border-color:var(--accent2); transform:translateY(-1px); }
  body.empty #hero { display:flex; }
  body.empty #chat, body.empty footer { display:none; }
  body:not(.empty) header { border-bottom:1px solid var(--line); }

  footer { padding:8px 16px 14px; }
  .note { max-width:720px; margin:8px auto 0; text-align:center; font-size:12px; color:var(--muted); }
  form { max-width:720px; width:100%; margin:0 auto; display:flex; align-items:flex-end; gap:8px; background:#fff;
         border:1.5px solid var(--line); border-radius:28px; padding:8px 8px 8px 20px; box-shadow:0 4px 18px rgba(232,67,31,.1); transition:.15s; }
  form:focus-within { border-color:var(--accent2); box-shadow:0 4px 22px rgba(255,138,31,.25); }
  textarea { flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--fg); font:inherit; max-height:160px; padding:7px 0; }
  textarea::placeholder { color:#b3a7a1; }
  #send { width:38px; height:38px; flex:none; border:0; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #send:disabled { background:#f3ece8; color:#c9bdb7; cursor:default; }
  #send:focus-visible, .chip:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body class="empty">
<header id="head"><div class="logo">🍗</div><span id="brandName"></span></header>
<main id="chat"><div class="wrap" id="log"></div></main>
<section id="hero">
  <div class="logo big">🍗</div>
  <h1>Hungry? Ask <span id="heroName"></span></h1>
  <p>Menu, prices, spicy picks, vegetarian options and allergens: just ask.</p>
  <div id="slotCenter">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ask about our menu" aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg></button>
    </form>
  </div>
  <div id="chips"></div>
</section>
<footer id="slotBottom"></footer>
<script>
// ====== Change these to match your restaurant ======
const RESTAURANT = "Quick Bite";
const WELCOME = "Hi! 👋 I'm the " + RESTAURANT + " assistant. I can help with our menu, prices, spicy options and allergens. What are you in the mood for?";
const QUICK = ["🌶 Spicy options", "🍕 Pizza menu", "🌱 Vegetarian?", "🧒 Anything for kids?", "🕒 Opening hours"];
// ===================================================

const log = document.getElementById("log"), chat = document.getElementById("chat"),
      form = document.getElementById("form"), input = document.getElementById("input"),
      send = document.getElementById("send");
const history = [];
let busy = false;

document.getElementById("brandName").textContent = RESTAURANT;
document.getElementById("heroName").textContent = RESTAURANT + "!";

function updateButton() { send.disabled = busy || !input.value.trim(); }

function add(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  if (role === "bot") { const l = document.createElement("div"); l.className = "logo"; l.textContent = "🍗"; row.appendChild(l); }
  const msg = document.createElement("div");
  msg.className = "msg";
  if (text === null) msg.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  else msg.textContent = text;
  row.appendChild(msg);
  log.appendChild(row); chat.scrollTop = chat.scrollHeight;
  return msg;
}

async function ask(text) {
  if (document.body.classList.contains("empty")) {          // first message: move the bar to the bottom
    document.body.classList.remove("empty");
    const footer = document.getElementById("slotBottom");
    footer.appendChild(form);
    const note = document.createElement("div");
    note.className = "note"; note.textContent = "Please confirm allergens with our staff.";
    footer.appendChild(note);
    add("bot", WELCOME);
  }
  history.push({ role:"user", content:text });
  add("user", text);
  const bot = add("bot", null);
  busy = true; updateButton();
  let reply = "";
  try {
    const res = await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"},
                                           body: JSON.stringify({ messages: history }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      reply += dec.decode(value, { stream:true });
      bot.textContent = reply; chat.scrollTop = chat.scrollHeight;
    }
  } catch (e) { reply = "Could not reach the server."; bot.textContent = reply; }
  if (!reply) bot.textContent = "Sorry, I didn't get an answer. Please try again.";
  history.push({ role:"assistant", content:reply || "..." });
  busy = false; updateButton(); input.focus();
}

QUICK.forEach(q => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = q;
  b.addEventListener("click", () => { if (!busy) ask(q.replace(/^\S+\s/, "")); });   // sends the text without the emoji
  document.getElementById("chips").appendChild(b);
});

form.addEventListener("submit", e => {
  e.preventDefault();
  const t = input.value.trim(); if (!t || busy) return;
  input.value = ""; input.style.height = "auto"; updateButton(); ask(t);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; updateButton(); });
input.focus();
</script>
</body>
</html>
